{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal EnCUCA</title>

    <link rel="stylesheet" href="{% static 'main/static/dashboard.css'%}">
</head>
<body>

<div class="page">
    <div class="shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-logo">CEUB</div>

                <nav class="sidebar-menu">
                    <a href="{% url 'dashboard_page' %}" class="menu-item active">
                        <span class="icon">🏠</span>
                        <span>Início</span>
                    </a>

                    <a href="{% url 'event_dashboard' %}" class="menu-item">
                        <span class="icon">📅</span>
                        <span>Eventos</span>
                    </a>

                    <a href="{% url 'temporary_subscription_page' %}" class="menu-item">
                        <span class="icon">📝</span>
                        <span>Inscrições</span>
                    </a>

                    <a href="{% url 'temporary_user_profile' %}" class="menu-item">
                        <span class="icon">👤</span>
                        <span>Perfil</span>
                    </a>
                </nav>
            </div>

            <a href="{% url 'logout' %}" class="sidebar-footer">
                <span class="icon">↩️</span>
                <span>Sair</span>
            </a>
        </aside>

        <!-- MAIN -->
        <div class="main">

            <!-- TOPBAR FINAL (SEM PESQUISA) -->
            <header class="topbar">

                <div class="topbar-left">
                    <h1>Início</h1>
                </div>

                <div class="topbar-right">
                    <div class="circle-icon" id="themeToggle">🌙</div>
                    <div class="circle-icon">🔔</div>
                    <div class="circle-icon">👤</div>
                    <a href="{% url 'user_profile' %}" class="btn-perfil">Acessar Perfil</a>
                </div>

            </header>

            <!-- CONTEÚDO -->
            <section class="content">
                <div class="card-banner">
                    Carrossel Principais Eventos
                </div>

                <div class="card-desc">
                    Descrição sobre o evento em destaque
                </div>
            </section>

        </div>
    </div>
</div>

<script>
    const body = document.body;
    const toggle = document.getElementById('themeToggle');

    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
        body.classList.add('dark-mode');
    }

    toggle.addEventListener('click', function () {
        body.classList.toggle('dark-mode');
        const newTheme = body.classList.contains('dark-mode') ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
    });
</script>

</body>
</html>
